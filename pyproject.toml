[project]
name = "busybar-agents"
version = "0.1.0"
description = "Let coding agents raise a hand on your BUSY Bar when they need you."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "David Khosid" }]
keywords = ["busy-bar", "flipper", "claude-code", "codex", "gemini-cli", "coding-agents", "hooks"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Topic :: Utilities",
]
dependencies = ["busylib>=2.6"]

[project.urls]
Homepage = "https://github.com/davidkh1/busybar-agents"
Issues = "https://github.com/davidkh1/busybar-agents/issues"

[project.scripts]
busybar-agents = "busybar_agents.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/busybar_agents"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
